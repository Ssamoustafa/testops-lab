name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest --cov=testops --cov-report=term-missing --cov-fail-under=90
      - name: Exercise quality gate
        run: testops examples/results.json --max-failure-rate 0 --max-flaky-tests 0 --max-p95-ms 2000
