[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testops-lab"
version = "0.1.0"
description = "A clean-architecture TestOps quality gate and test intelligence platform."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5", "ruff>=0.7", "mypy>=1.13"]

[project.scripts]
testops = "testops.interfaces.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/testops"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["testops"]
